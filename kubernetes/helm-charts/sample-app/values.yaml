# Default values — overridden by values-dev.yaml / values-prod.yaml
replicaCount: 1

image:
  repository: ghcr.io/tsprasath/diksha/sample-app
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-registry

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: sample-app.diksha.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  - name: NODE_ENV
    value: production
  - name: PORT
    value: "8080"

envFrom:
  - secretRef:
      name: diksha-app-secrets

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5

# Reloader annotation — restart pod when secret changes
podAnnotations:
  reloader.stakater.com/auto: "true"

serviceAccount:
  create: false
  name: ""

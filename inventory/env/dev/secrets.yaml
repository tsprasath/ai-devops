# ═══════════════════════════════════════════════════════
# DEV Secrets — Template (DO NOT commit real values)
# Copy to secrets.local.yaml and fill in values.
# secrets.local.yaml is in .gitignore
# ═══════════════════════════════════════════════════════
# To create K8s secrets from this file:
#   kubectl create secret generic diksha-app-secrets \
#     --from-literal=DB_PASSWORD=xxx \
#     --from-literal=JWT_SECRET=xxx \
#     -n diksha-app-dev
# Or use: kubectl apply -f secrets.local.yaml
# ═══════════════════════════════════════════════════════

apiVersion: v1
kind: Secret
metadata:
  name: diksha-app-secrets
  namespace: diksha-app-dev
  annotations:
    reloader.stakater.com/match: "true"
type: Opaque
stringData:
  # GitHub Container Registry credentials
  GHCR_USERNAME: "CHANGEME_GITHUB_USERNAME"
  GHCR_TOKEN: "CHANGEME_GITHUB_PAT_WITH_PACKAGES_READ"

  # Application secrets
  DB_HOST: "CHANGEME"
  DB_PORT: "5432"
  DB_NAME: "diksha_dev"
  DB_USERNAME: "CHANGEME"
  DB_PASSWORD: "CHANGEME"

  JWT_SECRET: "CHANGEME_RANDOM_32_CHAR_STRING"
  APP_SECRET_KEY: "CHANGEME_RANDOM_32_CHAR_STRING"

  # ArgoCD admin (minikube local)
  ARGOCD_ADMIN_PASSWORD: "CHANGEME"

  # Jenkins
  JENKINS_ADMIN_PASSWORD: "CHANGEME"
  GIT_TOKEN: "CHANGEME_GITHUB_PAT"
---
# GitHub Container Registry pull secret
# Created by bootstrap.sh automatically — this is the template
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-registry
  namespace: diksha-app-dev
  annotations:
    reloader.stakater.com/match: "true"
type: kubernetes.io/dockerconfigjson
data:
  # Base64 of: {"auths":{"ghcr.io":{"username":"<user>","password":"<PAT>","auth":"<base64(user:PAT)>"}}}
  .dockerconfigjson: "CHANGEME_BASE64_DOCKER_CONFIG"
